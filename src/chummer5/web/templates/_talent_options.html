<div id="talent-options-fragment">
  {% if selected_codename == "Magician" %}
  <label>
    {{ _("Web_Talent_Tradition") }}
    <select name="tradition_id">
      <option value="">{{ _("Web_Talent_ChooseTradition") }}</option>
      {% for tradition in traditions %}
      <option value="{{ tradition.id }}" {% if tradition.id == selected_tradition_id %}selected{% endif %}>
        {{ _("Web_Talent_TraditionOption", name=tradition | dterm("traditions.xml"), first=_("String_Attribute" ~ tradition.drain_attributes[0] ~ "Short"), second=_("String_Attribute" ~ tradition.drain_attributes[1] ~ "Short")) }}
      </option>
      {% endfor %}
    </select>
  </label>
  {% endif %}

  {% if skill_qty %}
  <fieldset>
    <legend>{{ _n("Web_Talent_FreeSkillGrant", skill_qty) }}</legend>
    {% for skill in eligible_skills %}
    <label>
      <input
        type="checkbox"
        name="granted_skill_id"
        value="{{ skill.id }}" {% if skill.id in selected_skill_ids %}checked{% endif %}
      />
      {{ skill | dterm("skills.xml") }}
    </label>
    {% endfor %}
  </fieldset>
  {% endif %}
</div>
