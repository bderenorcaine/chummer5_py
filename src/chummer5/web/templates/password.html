{% extends "_auth_layout.html" %}
{% block content %}
{% if current_user and current_user.must_change_password %}
<p class="warning">{{ _("Web_Auth_MustChangePassword") }}</p>
{% endif %}
<form method="post" action="/account/password" class="auth-form__fields">
  <label class="auth-form__field">
    {{ _("Web_Auth_CurrentPassword") }}
    <input type="password" name="current" maxlength="{{ max_password }}"
           autocomplete="current-password" required autofocus />
  </label>
  <label class="auth-form__field">
    {{ _("Web_Auth_NewPassword") }}
    <input type="password" name="password" minlength="{{ min_password }}"
           maxlength="{{ max_password }}" autocomplete="new-password" required />
    <small>{{ _("Web_Auth_PasswordHint", min=min_password) }}</small>
  </label>
  <label class="auth-form__field">
    {{ _("Web_Auth_PasswordConfirm") }}
    <input type="password" name="confirm" minlength="{{ min_password }}"
           maxlength="{{ max_password }}" autocomplete="new-password" required />
  </label>
  <button type="submit">{{ _("Web_Auth_ChangePasswordButton") }}</button>
</form>
{% if current_user and not current_user.must_change_password %}
<p class="auth-form__alt"><a href="/">{{ _("Web_Auth_BackToApp") }}</a></p>
{% endif %}
<form method="post" action="/logout" class="auth-form__alt">
  <button type="submit">{{ _("Web_Auth_Logout") }}</button>
</form>
{% endblock %}
